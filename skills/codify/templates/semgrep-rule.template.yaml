# Generated from {{finding_id}} ({{category}}) — sweep this pattern fleet-wide.
# Source finding: plans/findings/{{finding_id}}.md
# Tune severity to match your tracker's mapping; default High = SAST gate.
rules:
  - id: {{rule_id_kebab}}
    message: >-
      {{one_line_what_this_catches}}. Source: {{finding_id}}. See
      {{remediation_doc_or_pr_url}}.
    severity: ERROR   # ERROR | WARNING | INFO
    languages: [{{language}}]   # e.g. python, javascript, typescript, go, java
    metadata:
      category: security
      cwe: "{{CWE-id}}"
      owasp: "{{OWASP-category, optional}}"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      source-finding: {{finding_id}}
    patterns:
      # Replace with the minimal pattern that catches the vulnerable
      # shape *and* permits the safe shape. Prefer pattern-either with
      # pattern-not exclusions over one giant regex.
      - pattern-either:
          - pattern: {{vulnerable_pattern_1}}
          - pattern: {{vulnerable_pattern_2}}
      - pattern-not: {{safe_replacement_pattern}}
    fix: {{autofix_pattern_optional}}
