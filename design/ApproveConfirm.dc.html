<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #f7f8fa; }
    a { color: #1f6fd0; } a:hover { color: #17539c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f7f8fa; color: #14171c; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- dimmed board behind the sheet -->
  <div style="flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; filter: saturate(0.4); opacity: 0.32;">
    <div style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 22px;">Task Board</div>
    <div style="background: #ffffff; border: 1px solid #d8dde5; border-left: 3px solid #8a3ab5; border-radius: 4px; height: 82px;"></div>
    <div style="background: #ffffff; border: 1px solid #d8dde5; border-left: 3px solid #8a3ab5; border-radius: 4px; height: 82px;"></div>
    <div style="background: #ffffff; border: 1px solid #d8dde5; border-left: 3px solid #1f6fd0; border-radius: 4px; height: 82px;"></div>
  </div>

  <!-- scrim -->
  <div style="position: absolute; inset: 0; background: rgba(20, 23, 28, 0.44);"></div>

  <!-- confirm sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top-left-radius: 14px; border-top-right-radius: 14px; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 32px rgba(20,23,28,0.18);">

    <div style="width: 36px; height: 4px; border-radius: 2px; background: #d8dde5; align-self: center;"></div>

    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7280;">brainstorm-toolkit · stage-5.9-cleanup-pass.md</div>
      <div style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em;">Estimated cost</div>
    </div>

    <!-- cost estimate -->
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">$1.70</span>
      <span style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 22px; color: #6b7280; line-height: 1;">– $3.20</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; margin-top: -8px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7280;">6 steps · 2 surfaces</span>
      <span style="width: 3px; height: 3px; border-radius: 50%; background: #b9c0cb;"></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7280;">last 3 runs averaged $2.10</span>
    </div>

    <!-- model picker -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #6b7280;">Model cap</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7280;">ceiling, never a target</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1px solid #d8dde5; border-radius: 5px; background: #ffffff;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; color: #454c58;">haiku</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #6b7280;">~$0.40</span>
        </div>
        <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1.5px solid #1f6fd0; border-radius: 5px; background: #e7effb;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; color: #1f6fd0;">sonnet</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #1f6fd0;">~$2.10</span>
        </div>
        <div style="flex: 1; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 1px solid #d8dde5; border-radius: 5px; background: #ffffff;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 500; color: #454c58;">opus</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #6b7280;">~$8.90</span>
        </div>
      </div>
    </div>

    <!-- hard ceiling -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border: 1px solid #f0d9bd; background: #faeddd; border-radius: 6px;">
      <span style="display: flex; align-items: center; gap: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #94500b;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>
        hard stop at
      </span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #94500b;">$5.00</span>
    </div>

    <div style="display: flex; gap: 9px;">
      <div style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #ffffff; border: 1px solid #d8dde5; color: #454c58; font-size: 15px; font-weight: 500;">Cancel</div>
      <div style="flex: 2; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; background: #1f6fd0; color: #ffffff; font-size: 15.5px; font-weight: 600;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
        Start
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
