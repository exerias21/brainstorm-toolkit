name: skill-evals

# Tier 2 headless outcome evals (scripts/ci/skill-eval.py) run real `claude -p`
# sessions and spend real money -- workflow_dispatch and a weekly cron only,
# deliberately NOT attached to pull_request or push. See docs/EVALS.md.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Run one case by name instead of --all (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC

jobs:
  skill-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run skill evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${{ inputs.case }}" ]; then
            python scripts/ci/skill-eval.py --case "${{ inputs.case }}"
          else
            python scripts/ci/skill-eval.py --all
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          path: evals/skills/results/
          retention-days: 30
